[project]
name = "hukuk-burosu"
version = "1.2.0"
description = "Hukuk büro yönetim sistemi"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-auditlog>=3.4.1",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.1",
    "icalendar>=7.3.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pyzipper>=0.4.0",
    "recurring-ical-events>=3.8.2",
    "reportlab>=5.1.0",
    "waitress>=3.0.2",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff.lint.per-file-ignores]
# Rapor tanımları tablo düzeninde okunması için uzun satır içerir.
"apps/reports/*.py" = ["E501"]
"apps/imports/*.py" = ["E501"]
"apps/core/management/commands/seed_demo.py" = ["E501"]
"tests/*.py" = ["E501"]
