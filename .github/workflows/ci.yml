name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://hukuk:hukuk_ci@localhost:5434/hukuk
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hukuk
          POSTGRES_USER: hukuk
          POSTGRES_PASSWORD: hukuk_ci
        ports: ["5434:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --create-db
      - run: node --test tests/*.js tests/js/*.cjs
