{% extends "base.html" %}
{% block title %}Giriş kilitlendi — {{ office.name }}{% endblock %}
{% block anonymous %}
<div class="login-page">
  <div class="pin-card">
    <div class="hero-icon mx-auto" style="background: var(--danger-soft); color: var(--danger-ink)"><i class="bi bi-lock"></i></div>
    <h1 class="h5 fw-bold mt-3">Giriş geçici olarak kilitlendi</h1>
    <p class="text-body-secondary small mb-4">Çok sayıda hatalı PIN girildi. 15 dakika sonra tekrar deneyin veya yöneticiye başvurun.</p>
    <a class="btn btn-primary w-100" href="{% url 'accounts:login' %}">Giriş ekranına dön</a>
  </div>
</div>
{% endblock %}
