{% extends "base.html" %}
{% block title %}Müvekkiller — {{ office.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Müvekkiller</h1>
  </div>
  <div class="page-actions">
    <a class="btn btn-primary" href="{% url 'clients:create' %}"><i class="bi bi-person-plus"></i>Yeni müvekkil</a>
  </div>
</div>
<div class="card table-card" id="list-card">
  <form class="filter-bar" hx-get="{% url 'clients:list' %}" hx-target="#list-table" hx-push-url="true"
        hx-trigger="input changed delay:300ms from:input[name=q], change" hx-indicator="#list-card">
    <div class="grow"><i class="bi bi-search"></i><input class="form-control" type="search" name="q" value="{{ request.GET.q }}" placeholder="Ad, unvan, TCKN veya VKN ara"></div>
    <select class="form-select" name="kind">
      <option value="">Tüm tipler</option>
      {% for v, l in kinds %}<option value="{{ v }}" {% if request.GET.kind == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
    <select class="form-select" name="poa">
      <option value="">Vekalet: tümü</option>
      <option value="yes" {% if request.GET.poa == 'yes' %}selected{% endif %}>Vekaleti var</option>
      <option value="no" {% if request.GET.poa == 'no' %}selected{% endif %}>Vekaleti yok</option>
    </select>
    <select class="form-select" name="lawyer">
      <option value="">Tüm avukatlar</option>
      {% for u in lawyers %}<option value="{{ u.pk }}" {% if request.GET.lawyer == u.pk|stringformat:'s' %}selected{% endif %}>{{ u }}</option>{% endfor %}
    </select>
    <select class="form-select" name="intern">
      <option value="">Tüm stajyerler</option>
      {% for u in interns %}<option value="{{ u.pk }}" {% if request.GET.intern == u.pk|stringformat:'s' %}selected{% endif %}>{{ u }}</option>{% endfor %}
    </select>
    <select class="form-select" name="tasks">
      <option value="">Görev: tümü</option>
      <option value="yes" {% if request.GET.tasks == 'yes' %}selected{% endif %}>Açık görevi olan</option>
      <option value="no" {% if request.GET.tasks == 'no' %}selected{% endif %}>Açık görevi olmayan</option>
    </select>
    {% if can_view_balances %}
    <select class="form-select" name="debt">
      <option value="">Bakiye: tümü</option>
      <option value="yes" {% if request.GET.debt == 'yes' %}selected{% endif %}>Borçlu</option>
      <option value="no" {% if request.GET.debt == 'no' %}selected{% endif %}>Borcu yok</option>
    </select>
    {% endif %}
    <select class="form-select" name="sort" aria-label="Sıralama">
      {% for k, label in sort_options %}<option value="{{ k }}" {% if sort == k %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </form>
  <div id="list-table">{% include "clients/_list_table.html" %}</div>
</div>
{% endblock %}
