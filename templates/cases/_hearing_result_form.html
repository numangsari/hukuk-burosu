{% load ui %}
<form id="hearing-result-form" method="post" action="{% url 'hearings:result' hearing.pk %}{% if request.GET.pencere %}?pencere=1{% endif %}"
      hx-post="{% url 'hearings:result' hearing.pk %}{% if request.GET.pencere %}?pencere=1{% endif %}" hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  {% if result_form.non_field_errors %}<div class="alert alert-danger">{{ result_form.non_field_errors }}</div>{% endif %}
  {% include "partials/field.html" with field=result_form.result %}
  <div class="row">
    <div class="col-md-6">{% include "partials/field.html" with field=result_form.next_hearing_at %}</div>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-primary"><i class="bi bi-check2"></i>Sonucu kaydet</button>
    {% if hearing.result %}<button type="button" class="btn btn-light" @click="editResult = false">Vazgeç</button>{% endif %}
  </div>
</form>
