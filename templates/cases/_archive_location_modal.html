<div class="modal-dialog modal-dialog-centered">
  <form method="post" action="{% url 'archive:update_location' case.pk %}" class="modal-content" hx-post="{% url 'archive:update_location' case.pk %}" hx-target="#location-modal" hx-swap="innerHTML">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
    <div class="modal-header">
      <div>
        <h2 class="modal-title fs-6 mb-1">Fiziki Arşiv Yerini Düzenle</h2>
        <div class="text-body-secondary small">{{ case.display_name }} · {{ case.client|default:"Müvekkilsiz" }}</div>
      </div>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
    </div>
    <div class="modal-body">
      <div class="mb-3">
        <label class="form-label" for="id_archive_folder_no">Klasör Numarası / Adı</label>
        <input type="text" name="archive_folder_no" id="id_archive_folder_no" class="form-control"
               value="{{ case.archive_folder_no }}" list="folder-suggestions" placeholder="Örn: Açık 1, Kapalı 15, İcra 4...">
        <datalist id="folder-suggestions">
          {% for f in existing_folders %}
          <option value="{{ f }}">
          {% endfor %}
        </datalist>
        <div class="form-text">Bürodaki fiziksel klasör veya kutunun üzerindeki ad / numara.</div>
      </div>
      <div class="mb-2">
        <label class="form-label" for="id_archive_no">Klasör İçi Dosya Numarası</label>
        <input type="text" name="archive_no" id="id_archive_no" class="form-control"
               value="{{ case.archive_no }}" placeholder="Örn: 1, 14, 58...">
        <div class="form-text">Klasörün içindeki fiziki dosyanın sıra / dosya numarası.</div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button>
      <button type="submit" class="btn btn-primary"><i class="bi bi-check2 me-1"></i>Kaydet</button>
    </div>
  </form>
</div>
