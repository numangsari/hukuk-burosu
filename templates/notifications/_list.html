<div class="notif-head">
  <strong>Bildirimler</strong>
  {% if items %}<button class="btn btn-link btn-sm ms-auto p-0" hx-post="{% url 'notifications:read_all' %}" hx-target="#notif-menu">Tümünü okundu say</button>{% endif %}
</div>
<div class="notif-items">
{% for n in items %}
  <a class="notif-item{% if not n.is_read %} unread{% endif %}" href="{% url 'notifications:open' n.pk %}">
    <i class="bi {% if n.kind == 'deadline' %}bi-alarm{% elif n.kind == 'hearing' %}bi-bank2{% else %}bi-check2-square{% endif %}"></i>
    <span class="min-w-0">
      <span class="d-block">{{ n.title }}</span>
      {% if n.body %}<small class="d-block text-truncate">{{ n.body }}</small>{% endif %}
      <small class="d-block">{{ n.created_at|timesince }} önce</small>
    </span>
  </a>
{% empty %}
  <div class="empty-state py-4"><i class="bi bi-bell-slash"></i>Bildirim yok</div>
{% endfor %}
</div>
