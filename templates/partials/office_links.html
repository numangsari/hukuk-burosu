{% load ui %}
{% office_links as links %}
{% for link in links %}
<a class="{% if compact %}side-link{% else %}office-shortcut{% endif %}" href="{{ link.url }}"
   target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer"
   title="{{ link.description }} — yeni sekmede açılır">
  <i class="bi {{ link.icon }}" aria-hidden="true"></i>
  <span>{{ link.label }}</span>
  <i class="bi bi-box-arrow-up-right office-link-open" aria-hidden="true"></i>
  <span class="visually-hidden">yeni sekmede açılır</span>
</a>
{% endfor %}
