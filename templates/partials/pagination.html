{% load ui %}
<div class="table-footer">
  <span>{% if page_obj %}{{ page_obj.start_index }}–{{ page_obj.end_index }} / {{ paginator.count }} kayıt{% else %}{{ paginator.count|default:0 }} kayıt{% endif %}</span>
  {% if page_obj.has_other_pages %}
  <ul class="pagination pagination-sm mb-0">
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link" href="{% if page_obj.has_previous %}{% query_with page=page_obj.previous_page_number %}{% else %}#{% endif %}"><i class="bi bi-chevron-left"></i></a>
    </li>
    <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ paginator.num_pages }}</span></li>
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link" href="{% if page_obj.has_next %}{% query_with page=page_obj.next_page_number %}{% else %}#{% endif %}"><i class="bi bi-chevron-right"></i></a>
    </li>
  </ul>
  {% endif %}
</div>
